<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Strata</title>
<link rel="icon" href="web/favicon.svg" type="image/svg+xml" >
<script>
  // the theme before the first paint: the saved choice, else the system's
  try {
    document.documentElement.dataset.theme = localStorage.getItem("strata.theme") ||
      (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  } catch (e) {}
  // iOS zooms in on any field under 16px when it gets focus, and stays zoomed. maximum-scale=1 stops that there
  // (iOS still lets the reader pinch-zoom); elsewhere it would block pinch zoom, so only on iOS.
  if (/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
    const v = document.querySelector("meta[name=viewport]");
    v.content += ", maximum-scale=1";
  }
</script>
  <script type="module" crossorigin src="web/app.js"></script>
  <link rel="stylesheet" crossorigin href="web/app.css">
</head>
<body>
<div id="app"></div>
</body>
</html>
